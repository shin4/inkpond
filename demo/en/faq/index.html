    <script>
      // Apply the saved theme before first paint (see Landing.tsx).
      try {
        const t = localStorage.getItem("inkpond-site.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
